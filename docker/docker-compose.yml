services:
	mongodb:
		image: mongo:7
		restart: unless-stopped
		ports:
			- "27017:27017"
		volumes:
			- dealflow360-mongo:/data/db

	backend:
		build:
			context: ../backend
			dockerfile: ../docker/Dockerfile.backend
		restart: unless-stopped
		ports:
			- "5000:5000"
		environment:
			NODE_ENV: production
			PORT: 5000
			MONGODB_URI: mongodb://mongodb:27017/dealflow360
			CLIENT_URL: http://localhost:3000
			JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
			JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
		depends_on:
			- mongodb

	frontend:
		build:
			context: ../frontend
			dockerfile: ../docker/Dockerfile.frontend
		restart: unless-stopped
		ports:
			- "3000:80"
		depends_on:
			- backend

volumes:
	dealflow360-mongo:
